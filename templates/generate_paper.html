{% extends "base.html" %}

{% block title %}Generate Question Paper{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body p-4">
        <h2 class="card-title text-center mb-4">
            <i class="bi bi-file-earmark-pdf"></i> Generate Question Paper PDF
        </h2>
        <p class="text-center text-muted mb-4">
            Select a subject to generate a formatted, exam-style question paper.
        </p>

        <form action="{{ url_for('generator.generate_paper') }}" method="POST">
            <div class="mb-3">
                <label for="subject_id" class="form-label">1. Select Subject</label>
                <select class="form-select" id="subject_id" name="subject_id" required>
                    <option value="" disabled selected>-- Choose a Subject --</option>
                    {% for subject in subjects %}
                        <option value="{{ subject.id }}">{{ subject.name }} ({{ subject.branch_name }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="exam_session" class="form-label">2. Exam Session</label>
                <input type="text" class="form-control" id="exam_session" name="exam_session" value="{{ exam_session }}" placeholder="e.g., Fall 2025" required>
            </div>
            
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-arrow-down-circle"></i> Generate & Download PDF
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
